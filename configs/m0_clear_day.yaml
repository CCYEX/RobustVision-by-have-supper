# M0 训练配置（计划书 D9 卡片定稿）。云端只需改一个字：path 指向数据根目录。
# train/val 是相对 path 的带路径名单，由 `python -m rvkit.harness.datasets --data-root ...`
# 生成的 splits_train/*_paths.txt；names = BDD100K 的 10 个检测类（我们自己的口径）。
path: /root/autodl-tmp/data
train: splits_train/train_clear_all_paths.txt
val: splits_train/trainval_1k_paths.txt
names: {0: person, 1: rider, 2: car, 3: truck, 4: bus, 5: train, 6: motor, 7: bike, 8: traffic light, 9: traffic sign}
