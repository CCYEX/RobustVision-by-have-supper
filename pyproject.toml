[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rvkit"
version = "0.0.1"
description = "Robustness checkup toolkit for YOLO-family object detectors: condition x corruption degradation reports + confidence calibration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "ultralytics>=8.3,<9",
    # 1.4.24 = corruptions.py 全部算子实测验证的版本（RandomRain / Compose(seed) 等
    # 都以它为准）；2.0 改参数名，升级前先过 tests/。上限 <1.5 挡住 2.0 大版本。
    "albumentations>=1.4.24,<1.5",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "pyarrow>=15",   # predict_cache.py 写 parquet（9/9 校准的答案表）
]

[project.scripts]
rvkit = "rvkit.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/rvkit"]
